<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<meta name="mobile-web-app-capable" content="yes">

<body>

<p id="saveWarn" class="save-warn" role="alert" hidden data-t="app.notSavedOnThis"></p>
<p id="syncWarn" class="save-warn" role="alert" hidden><span id="syncWarnText"></span>
  <button class="text-btn" id="syncRetry" data-t="sync.retry"></button>
  <button class="text-btn" id="syncBackup" data-t="sync.saveBackup"></button></p>

<p id="notSavedBar" class="save-warn soft" hidden><span data-t="app.notSavedToAn"></span> <button class="text-btn" id="notSavedSignIn" data-t="app.signIn"></button></p>

<!-- ===== Sign in (required on the website) ===== -->
<section id="gate" class="gate" hidden aria-labelledby="gateTitle">
  <div class="gate-box">
    <svg class="empty-art" viewBox="0 0 120 80" aria-hidden="true"><path d="M60 18c-12-8-30-9-46-6v54c16-3 34-2 46 6 12-8 30-9 46-6V12c-16-3-34-2-46 6Z"/><path d="M60 18v54"/></svg>
    <h1 id="gateTitle" data-t="app.learningCalendar"></h1>
    <p class="gate-sub" data-t="gate.signInToStart"></p>
    <button class="btn primary wide" id="googleSignIn" disabled data-t="gate.continueWithGoogle"></button>
    <form id="linkForm" class="link-form">
      <label class="field" for="linkEmail" data-t="gate.orGetASign"></label>
      <input type="email" id="linkEmail" autocomplete="email" required data-t-placeholder="gate.youExampleCom">
      <button class="btn wide" id="sendLink" disabled data-t="gate.emailMeASign"></button>
      <button type="button" class="text-btn" id="sendAnother" hidden data-t="gate.sendAnother"></button>
    </form>
    <p class="note" id="accountNote" role="status"></p>
    <details class="gate-privacy">
      <summary data-t="gate.whatWeKeep"></summary>
      <p data-t="gate.yourEmailAddressAnd"></p>
    </details>
    <button class="text-btn" id="gateClose" hidden data-t="gate.notNow"></button>
  </div>
</section>

<!-- ===== Today ===== -->
<section id="today" class="view">
  <header class="topbar">
    <div>
      <p class="eyebrow" id="todayDate" data-t="today.loading"></p>
      <h1 id="todayTitle" data-t="today.today"></h1>
    </div>
    <button class="icon-btn" data-go="add" data-t-aria-label="today.addASefer"><svg data-icon="plus"></svg></button>
  </header>
  <nav class="week" id="week" data-t-aria-label="today.thisWeek"></nav>
  <p class="day-status" id="dayStatus"></p>
  <button type="button" class="save-state" id="saveState" hidden></button>
  <div class="panel welcome" id="welcome" hidden>
    <p id="welcomeText"></p>
    <div class="two"><button class="btn" id="welcomeOk" data-t="welcome.ok"></button><button class="btn" id="welcomeMissing" data-t="welcome.missing"></button></div>
  </div>
  <div id="cards" class="stack"></div>
  <button class="text-btn print-btn" id="printWeek" hidden data-t="print.button"></button>
  <div id="empty" class="empty" hidden>
    <svg class="empty-art" viewBox="0 0 120 80" aria-hidden="true"><path d="M60 18c-12-8-30-9-46-6v54c16-3 34-2 46 6 12-8 30-9 46-6V12c-16-3-34-2-46 6Z"/><path d="M60 18v54"/></svg>
    <h2 data-t="today.startYourFirstSefer"></h2>
    <p data-t="today.chooseASeferAnd"></p>
    <button class="btn primary" data-go="add" data-t="today.chooseASefer"></button>
  </div>
</section>

<!-- ===== My seforim ===== -->
<section id="library" class="view" hidden>
  <header class="topbar">
    <div><p class="eyebrow" data-t="library.learningNow"></p><h1 data-t="library.seforim"></h1></div>
    <button class="icon-btn" data-go="add" data-t-aria-label="today.addASefer"><svg data-icon="plus"></svg></button>
  </header>
  <div id="libraryList" class="list"></div>
  <div id="libraryEmpty" class="empty" hidden>
    <h2 data-t="library.nothingYet"></h2>
    <p data-t="library.seforimYouLearnWill"></p>
    <button class="btn primary" data-go="add" data-t="today.chooseASefer"></button>
  </div>
</section>

<!-- ===== One sefer ===== -->
<section id="plan" class="view" hidden>
  <header class="navbar">
    <button class="back" data-go="library"><svg data-icon="back"></svg><span data-t="library.seforim"></span></button>
  </header>
  <div class="plan-head">
    <h1 class="he-title" id="planTitle" lang="he" dir="rtl"></h1>
    <p class="muted" id="planSub"></p>
    <div class="progress"><i id="planBar"></i></div>
    <div class="stats" id="planStats"></div>
  </div>

  <div class="panel calendar">
    <div class="cal-head">
      <button class="icon-btn small" id="calPrev" data-t-aria-label="plan.previousMonth"><svg data-icon="back"></svg></button>
      <h2 id="calMonth"></h2>
      <button class="icon-btn small" id="calNext" data-t-aria-label="plan.nextMonth"><svg data-icon="next"></svg></button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-key"><span><i class="k-done"></i><span data-t="plan.done"></span></span><span><i class="k-plan"></i><span data-t="plan.toLearn"></span></span><span><i class="k-off"></i><span data-t="plan.off"></span></span></div>
    <div class="cal-detail" id="calDetail"></div>
  </div>

  <h3 class="group-title" data-t="plan.changeThePlan"></h3>
  <form class="panel form-rows" id="planEdit">
    <label class="field"><span data-t="plan.finishBy"></span> <input type="date" id="editEnd"></label>
    <div class="two">
      <label class="field"><span data-t="plan.daysOffFrom"></span> <input type="date" id="editOffStart"></label>
      <label class="field"><span data-t="plan.until"></span> <input type="date" id="editOffEnd"></label>
    </div>
    <button type="submit" class="btn" data-t="plan.saveChanges"></button>
    <p class="note" data-t="plan.daysAlreadyDoneStay"></p>
  </form>
  <p class="note panel" id="cycleNote" hidden></p>

  <h3 class="group-title" data-t="dedication.title"></h3>
  <form class="panel form-rows" id="dedEdit">
    <div class="seg" role="radiogroup" data-t-aria-label="dedication.title">
      <label><input type="radio" name="editDedKind" value=""><span data-t="dedication.none"></span></label>
      <label><input type="radio" name="editDedKind" value="ilui-nishmas"><span data-t="dedication.iluiNishmas"></span></label>
      <label><input type="radio" name="editDedKind" value="refuah-shleimah"><span data-t="dedication.refuah"></span></label>
    </div>
    <input id="editDedName" maxlength="80" autocomplete="off" data-t-placeholder="dedication.namePlaceholder">
    <button type="submit" class="btn" data-t="dedication.save"></button>
  </form>

  <button class="btn" id="reviewPlan" data-t="review.start"></button>
  <button class="btn" id="sharePlan" data-t="share.button"></button>
  <div class="panel form-rows" id="shareBox" hidden>
    <p class="note" data-t="share.howTo"></p>
    <input id="shareLink" readonly>
    <div class="two"><button class="btn primary" id="shareSend" data-t="share.send"></button><button class="btn" id="shareCopy" data-t="share.copy"></button></div>
  </div>
  <button class="btn" id="exportPlan" data-t="export.button"></button>
  <p class="note" data-t="export.note"></p>

  <details class="panel all-days">
    <summary><span id="planDaysTitle" data-t="plan.daysOfThePlan"></span> <svg data-icon="down"></svg></summary>
    <ol id="planDays" class="day-list"></ol>
  </details>

  <button class="btn danger-text" id="deletePlan" data-t="plan.stopLearningThisSefer"></button>
</section>

<!-- ===== Settings ===== -->
<section id="settings" class="view" hidden>
  <header class="topbar"><div><p class="eyebrow" data-t="app.learningCalendar"></p><h1 data-t="settings.settings"></h1></div></header>

  <h3 class="group-title" data-t="settings.account"></h3>
  <div class="panel form-rows" id="account">
    <div id="signedOut">
      <p class="note" id="signedOutNote" data-t="settings.notSignedInYour"></p>
      <button class="btn primary wide" id="openGate" data-t="app.signIn"></button>
    </div>
    <div id="signedIn" hidden>
      <p class="account-who"><span data-t="settings.signedInAs"></span> <b id="accountEmail"></b></p>
      <button class="btn" id="signOut" data-t="settings.signOutThisPhone"></button>
      <p class="note" id="syncState" data-t="settings.yourPlansAreSaved"></p>
      <label class="field" for="displayName" data-t="settings.displayNameOptional"></label>
      <input id="displayName" maxlength="60" autocomplete="name" data-t-placeholder="settings.howOtherLearnersWould">
      <label class="switch-row"><input type="checkbox" id="shareLearning"> <span data-t="settings.letOtherLearnersSee"></span> <span class="pill" data-t="settings.comingLater"></span></label>
      <p class="note" data-t="settings.offUnlessYouTurn"></p>
      <button class="btn danger-soft" id="deleteAccount" data-t="settings.deleteAccount"></button>
    </div>
    <button class="row-link" data-go="privacy"><span data-t="settings.privacy"></span> <svg data-icon="next"></svg></button>
  </div>

  <h3 class="group-title" data-t="settings.appearance"></h3>
  <div class="panel form-rows">
    <div class="field"><span data-t="settings.language"></span>
      <div class="seg" role="radiogroup" data-t-aria-label="settings.language">
        <label><input type="radio" name="lang" value="en"><span data-t="settings.langEnglish" lang="en"></span></label>
        <label><input type="radio" name="lang" value="he"><span data-t="settings.langHebrew" lang="he"></span></label>
      </div>
      <p class="note" data-t="settings.languageNote"></p>
    </div>
    <div class="field"><span data-t="settings.theme"></span>
      <div class="seg" role="radiogroup" data-t-aria-label="settings.theme">
        <label><input type="radio" name="theme" value="auto"><span data-t="settings.automatic"></span></label>
        <label><input type="radio" name="theme" value="light"><span data-t="settings.light"></span></label>
        <label><input type="radio" name="theme" value="dark"><span data-t="settings.dark"></span></label>
      </div>
    </div>
    <div class="field"><span data-t="settings.style"></span>
      <div class="seg" role="radiogroup" data-t-aria-label="settings.style">
        <label><input type="radio" name="style" value="solid"><span data-t="settings.solid"></span></label>
        <label><input type="radio" name="style" value="glass"><span data-t="settings.glass"></span></label>
      </div>
    </div>
    <div class="field"><span data-t="settings.color"></span>
      <div class="swatches" id="swatches" role="radiogroup" data-t-aria-label="settings.color"></div>
    </div>
  </div>

  <h3 class="group-title" data-t="place.title"></h3>
  <div class="panel form-rows">
    <div class="seg" role="radiogroup" data-t-aria-label="place.title">
      <label><input type="radio" name="yomTovPlace" value="out"><span data-t="place.outside"></span></label>
      <label><input type="radio" name="yomTovPlace" value="il"><span data-t="place.israel"></span></label>
    </div>
    <p class="note" data-t="place.note"></p>
  </div>

  <h3 class="group-title" data-t="settings.dailyReminder"></h3>
  <div class="panel form-rows">
    <p class="note" data-t="settings.aReminderFromYour"></p>
    <label class="row-link"><span data-t="settings.time"></span> <input type="time" id="reminderTime" value="20:00" class="row-date"></label>
    <p class="note" id="reminderDays"></p>
    <button class="btn primary wide" id="addReminder" data-t="settings.addToMyCalendar"></button>
    <p class="note" id="reminderHelp" data-t="settings.onIphoneAndIpad"></p>
  </div>

  <h3 class="group-title" data-t="settings.sectionNames"></h3>
  <div class="panel form-rows">
    <div class="seg" role="radiogroup" data-t-aria-label="settings.sectionNames">
      <label><input type="radio" name="names" value="he"><span data-t="settings.hebrew"></span></label>
      <label><input type="radio" name="names" value="en"><span data-t="settings.english"></span></label>
    </div>
    <p class="note" data-t-html="settings.forSeforimDividedInto"></p>
  </div>

  <details class="panel inline-details" id="stoppedBox" hidden>
    <summary><span data-t="stopped.title"></span> <span class="row-value" id="stoppedCount"></span><svg data-icon="down"></svg></summary>
    <p class="note" data-t="stopped.note"></p>
    <div id="stoppedList" class="off-list"></div>
  </details>

  <details class="panel inline-details" id="exportBox">
    <summary><span data-t="settings.exportAndImport"></span> <svg data-icon="down"></svg></summary>
    <p class="note" data-t="settings.aCopyOfYour"></p>
    <p class="note" id="lastBackup"></p>
    <div class="two">
      <button class="btn" id="backup" data-t="settings.export"></button>
      <label class="btn file-btn" id="restoreBtn"><span data-t="settings.importAFile"></span><input type="file" id="restore" class="file-input" accept=".json,application/json"></label>
    </div>
    <button class="btn" id="undoRestore" hidden></button>
    <div id="backupBox" class="form-rows" hidden>
      <p class="note" id="backupSummary"></p>
      <p class="note" data-t="settings.ifNoFileWas"></p>
      <textarea id="backupText" readonly></textarea>
      <button class="btn" id="copyBackup" data-t="settings.copyBackupText"></button>
    </div>
    <details class="inline-details">
      <summary data-t="settings.loadABackupFrom"></summary>
      <textarea id="pasteBackup" data-t-placeholder="settings.pasteTheBackupText"></textarea>
      <button class="btn" id="loadPasted" data-t="settings.loadThisBackup"></button>
    </details>
  </details>

  <div class="panel list-rows">
    <button class="row-link" data-go="about"><span data-t="settings.aboutAndSources"></span> <svg data-icon="next"></svg></button>
  </div>
</section>

<!-- ===== Kol HaTorah in a year ===== -->
<section id="kol" class="view" hidden>
  <header class="navbar"><button class="back" data-go="add"><svg data-icon="back"></svg><span data-t="add.back"></span></button></header>
  <h1 data-t="kol.title"></h1>
  <p class="muted" data-t="kol.intro"></p>
  <div class="panel pick-rows" id="kolList"></div>
  <details class="panel inline-details">
    <summary><span data-t="kol.addOther"></span> <svg data-icon="down"></svg></summary>
    <div class="search"><svg data-icon="search"></svg><input type="search" id="kolSearch" autocomplete="off" data-t-placeholder="add.searchInEnglishOr"></div>
    <div class="pick-rows" id="kolFound"></div>
  </details>
  <div class="panel form-rows">
    <label class="row-link"><span data-t="add.startOn"></span> <input type="date" id="kolStart" class="row-date"></label>
    <label class="row-link"><span data-t="add.finishOn"></span> <input type="date" id="kolEnd" class="row-date"></label>
    <p class="note" id="kolSummary" aria-live="polite"></p>
  </div>
  <button class="btn primary wide" id="kolCreate" data-t="kol.create"></button>

<!-- ===== Public cycles ===== -->
<section id="cycles" class="view" hidden>
  <header class="navbar"><button class="back" data-go="add"><svg data-icon="back"></svg><span data-t="add.back"></span></button></header>
  <h1 data-t="cycles.title"></h1>
  <p class="muted" data-t="cycles.intro"></p>
  <div id="cycleList" class="stack"></div>
</section>

<!-- ===== Add a sefer: three steps ===== -->
<section id="add" class="view wizard" hidden>
  <header class="wiz-bar">
    <button class="text-btn" id="wizBack" data-t="add.cancel"></button>
    <div class="wiz-steps" aria-hidden="true"><i></i><i></i><i></i></div>
    <span class="wiz-count" id="wizCount" data-t="add.1Of3"></span>
  </header>

  <!-- step 1: which sefer -->
  <div class="wiz-step" id="step1">
    <h1 data-t="today.chooseASefer"></h1>
    <div class="quick-starts">
      <button type="button" class="panel quick" data-go="kol"><b data-t="kol.title"></b><span data-t="kol.short"></span></button>
      <button type="button" class="panel quick" data-go="cycles"><b data-t="cycles.title"></b><span data-t="cycles.short"></span></button>
    </div>
    <div class="search"><svg data-icon="search"></svg><input type="search" id="wizSearch" autocomplete="off" data-t-placeholder="add.searchInEnglishOr"></div>
    <div class="chips-scroll" id="wizCols" role="tablist" data-t-aria-label="add.collections"></div>
    <div class="list-tools"><span id="wizChosen" class="muted"></span><span><button class="text-btn" id="wizAll" data-t="add.selectAllAvailable"></button><button class="text-btn" id="wizNone" data-t="add.clear"></button></span></div>
    <div class="panel pick-rows" id="wizList"></div>
    <p class="note col-note" id="colNote"></p>

    <div id="commentaryBox" hidden>
      <h3 class="group-title" data-t="add.learnTogetherWith"></h3>
      <div class="panel"><div id="commentaries" class="toggles"></div></div>
    </div>

    <details class="panel inline-details" id="rangeBox">
      <summary><span data-t="add.onlyPartOfThe"></span> <svg data-icon="down"></svg></summary>
      <div class="two">
        <label class="field"><span data-t="add.from"></span> <input id="fromPiece" autocomplete="off"></label>
        <label class="field"><span data-t="add.to"></span> <input id="toPiece" autocomplete="off"></label>
      </div>
      <p class="note" id="rangeHint"></p>
    </details>
  </div>

  <!-- step 2: how to learn it -->
  <div class="wiz-step" id="step2" hidden>
    <h1 data-t="add.setYourPace"></h1>
    <p class="he-sub" id="wizSeferName" lang="he" dir="rtl"></p>

    <div class="seg big" role="radiogroup" data-t-aria-label="add.howMuch">
      <label><input type="radio" name="mode" value="finish" checked><span data-t="plan.finishBy"></span></label>
      <label><input type="radio" name="mode" value="amount"><span data-t="add.dailyAmount"></span></label>
      <label><input type="radio" name="mode" value="time"><span data-t="add.timeADay"></span></label>
    </div>

    <div class="panel dial" id="finishBox">
      <label class="dial-label" for="endDate" data-t="add.finishOn"></label>
      <input type="date" id="endDate" class="dial-date">
      <p class="note" data-t="add.theSeferIsShared"></p>
    </div>
    <div class="panel dial" id="amountBox" hidden>
      <span class="dial-label" data-t="add.eachDay"></span>
      <div class="stepper">
        <button type="button" class="step-btn" data-step="amount" data-by="-1" data-t-aria-label="add.less">−</button>
        <div class="step-val"><input type="number" id="amount" min="0.05" step="0.05" value="1" inputmode="decimal"><span id="amountUnit" data-t="add.amud"></span></div>
        <button type="button" class="step-btn" data-step="amount" data-by="1" data-t-aria-label="add.more">+</button>
      </div>
    </div>
    <div class="panel dial" id="timeBox" hidden>
      <span class="dial-label" data-t="add.eachDay"></span>
      <div class="stepper">
        <button type="button" class="step-btn" data-step="minutes" data-by="-1" data-t-aria-label="add.less">−</button>
        <div class="step-val"><input type="number" id="minutes" min="1" step="1" value="10" inputmode="numeric"><span data-t="add.minutes"></span></div>
        <button type="button" class="step-btn" data-step="minutes" data-by="1" data-t-aria-label="add.more">+</button>
      </div>
      <div class="seg" role="radiogroup" data-t-aria-label="add.myPace">
        <label><input type="radio" name="pace" value="0.7"><span data-t="add.slower"></span></label>
        <label><input type="radio" name="pace" value="1" checked><span data-t="add.average"></span></label>
        <label><input type="radio" name="pace" value="1.4"><span data-t="add.faster"></span></label>
      </div>
      <p class="note" id="timeHint"></p>
    </div>

    <h3 class="group-title" data-t="add.daysILearn"></h3>
    <div class="panel form-rows">
      <div class="day-toggles" id="days"></div>
      <button type="button" class="row-link" id="lighterRow" aria-describedby="lighterHint"><span data-t="add.lighterDay"></span> <span class="row-value" id="lighterValue" data-t="add.fri"></span><svg data-icon="next"></svg></button>
      <p class="note" id="lighterHint" data-t="add.aShorterDayAbout"></p>
      <label class="row-link"><span data-t="add.startOn"></span> <input type="date" id="startDate" class="row-date"></label>
      <label class="switch-row"><input type="checkbox" id="skipYomTov"> <span data-t="add.skipYomTov"></span></label>
      <p class="note" id="yomTovHint"></p>
    </div>

    <details class="panel inline-details" id="daysOffBox">
      <summary><span data-t="add.daysOff"></span> <span class="row-value" id="daysOffCount"></span><svg data-icon="down"></svg></summary>
      <div id="daysOffList" class="off-list"></div>
      <div class="two">
        <label class="field"><span data-t="add.from"></span> <input type="date" id="offStart"></label>
        <label class="field"><span data-t="add.to"></span> <input type="date" id="offEnd"></label>
      </div>
      <label class="field"><span data-t="add.reasonOptional"></span> <input id="offLabel" data-t-placeholder="add.vacationYomTov"></label>
      <button type="button" class="btn" id="addOff" data-t="add.addDaysOff"></button>
    </details>
  </div>

  <!-- step 3: review -->
  <div class="wiz-step" id="step3" hidden>
    <h1 data-t="add.yourPlan"></h1>
    <div id="review"></div>
    <div class="panel form-rows">
      <label class="switch-row"><input type="checkbox" id="isReview"> <span data-t="review.switch"></span></label>
      <p class="note" data-t="review.note"></p>
    </div>
    <h3 class="group-title" data-t="dedication.title"></h3>
    <div class="panel form-rows" id="dedicationBox">
      <div class="seg" role="radiogroup" data-t-aria-label="dedication.title">
        <label><input type="radio" name="dedKind" value="" checked><span data-t="dedication.none"></span></label>
        <label><input type="radio" name="dedKind" value="ilui-nishmas"><span data-t="dedication.iluiNishmas"></span></label>
        <label><input type="radio" name="dedKind" value="refuah-shleimah"><span data-t="dedication.refuah"></span></label>
      </div>
      <input id="dedName" maxlength="80" autocomplete="off" data-t-placeholder="dedication.namePlaceholder">
    </div>
  </div>

  <footer class="wiz-foot">
    <div class="wiz-sum" id="preview" aria-live="polite"></div>
    <button class="btn primary" id="wizNext" data-t="add.next"></button>
    <button class="btn primary" id="create" hidden data-t="add.startLearning"></button>
  </footer>
</section>

<!-- bottom bar -->
<nav class="tabbar" data-t-aria-label="app.screens">
  <button data-go="today"><svg data-icon="today"></svg><span data-t="today.today"></span></button>
  <button data-go="library"><svg data-icon="books"></svg><span data-t="library.seforim"></span></button>
  <button data-go="settings"><svg data-icon="gear"></svg><span data-t="settings.settings"></span></button>
</nav>

<!-- sheets -->
<dialog id="missed" class="sheet">
  <form method="dialog">
    <h2 id="missedTitle" data-t="missed.youMissedADay"></h2>
    <p id="missedText" class="muted"></p>
    <button value="push" class="btn primary" data-t="missed.pushTheFinishDate"></button>
    <button value="spread" class="btn" data-t="missed.spreadItOverThe"></button>
    <button value="double" class="btn" data-t="missed.doubleUpOnThe"></button>
    <button value="cancel" class="text-btn center" data-t="gate.notNow"></button>
  </form>
</dialog>

<dialog id="picker" class="sheet">
  <form method="dialog">
    <h2 id="pickerTitle"></h2>
    <div id="pickerList" class="pick-rows" role="listbox"></div>
    <button value="cancel" class="text-btn center" data-t="add.cancel"></button>
  </form>
</dialog>

<dialog id="choose" class="sheet">
  <form method="dialog">
    <div id="chooseText"></div>
    <div id="chooseButtons" class="form-rows"></div>
    <button value="" class="text-btn center" data-t="add.cancel"></button>
  </form>
</dialog>

<dialog id="ask" class="sheet">
  <form method="dialog">
    <p id="askText"></p>
    <button value="yes" class="btn danger" id="askYes" data-t="ask.yes"></button>
    <button value="no" class="btn" data-t="add.cancel"></button>
  </form>
</dialog>

<div id="toast" role="status"></div>
<section id="printSheet" class="print-sheet" aria-hidden="true"></section>

<script>
  // If anything fails while the app starts, say so on the page instead of staying blank.
  window.addEventListener("error", function (e) {
    var m = document.querySelector(".view:not([hidden])") || document.body;
    m.insertAdjacentHTML("afterbegin", '<p class="error-box">Something went wrong: ' +
      String(e.message || e).replace(/[<&]/g, "") + '. Please tell Claude this message.</p>');
  });
  window.addEventListener("unhandledrejection", function (e) {
    window.dispatchEvent(new ErrorEvent("error", { message: String(e.reason && e.reason.message || e.reason) }));
  });
</script>
